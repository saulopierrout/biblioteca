<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Em construção · Biblioteca de Skills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F7F5;--ink:#0E0E10;--ink2:#2A2A2E;--muted:#6A6A70;--line:rgba(14,14,16,.12);--accent:#E5194B;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;--sans:"Archivo",system-ui,sans-serif;
  --chanfro:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
header{border-bottom:1px solid var(--line);background:#fff}
.hwrap{max-width:1440px;margin:0 auto;height:68px;padding:0 40px;display:flex;align-items:center;gap:32px}
.marca{font:600 11px var(--mono);letter-spacing:.32em}
nav{display:flex;gap:28px;margin:0 auto}
nav a{font:500 14px var(--sans);color:var(--ink2);position:relative;padding:6px 0}
nav a.on{color:var(--ink)}
nav a.on:after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--accent)}
main{flex:1;display:grid;place-items:center;padding:60px 20px}
.box{text-align:center;max-width:560px}
.rotulo{font:500 11px var(--mono);letter-spacing:.28em;color:var(--muted);display:inline-flex;gap:10px;align-items:center}
.rotulo i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
h1{margin-top:16px;font-weight:900;font-stretch:108%;font-size:clamp(40px,6vw,72px);line-height:.9;letter-spacing:-.035em;text-transform:uppercase}
h1 span{color:var(--accent)}
p{margin-top:16px;color:var(--ink2);line-height:1.6}
.botoes{display:flex;gap:10px;justify-content:center;margin-top:28px;flex-wrap:wrap}
.btn{padding:14px 20px;clip-path:var(--chanfro);background:var(--ink);color:#fff;font:500 11px var(--mono);letter-spacing:.14em}
.btn:hover{background:var(--accent)}
</style>
</head>
<body>
<header><div class="hwrap"><a class="marca" href="inicio.html">SAULO PIERROUT</a>
  <nav aria-label="Principal"><a href="inicio.html">Início</a><a href="biblioteca.html">Biblioteca</a><a id="lp" href="protocolos.html">Protocolos</a><a id="la" href="animacao.html">Animação</a></nav></div></header>
<main><div class="box">
  <div class="rotulo"><i></i>EM CONSTRUÇÃO</div>
  <h1 id="titulo">Protocolos<span>.</span></h1>
  <p id="texto">Esta parte ainda está sendo redesenhada com a identidade nova. Enquanto isso, a versão atual continua no site publicado.</p>
  <div class="botoes"><a class="btn" href="biblioteca.html">IR PARA A BIBLIOTECA</a><a class="btn" id="atual" href="#" target="_blank" rel="noopener">VER A VERSÃO ATUAL ↗</a></div>
</div></main>
<script>
const p = new URLSearchParams(location.search).get("p") === "animacao" ? "animacao" : "protocolos";
const NOMES = {protocolos: "Protocolos", animacao: "Animação"};
document.getElementById("titulo").innerHTML = NOMES[p] + "<span>.</span>";
document.title = NOMES[p] + " · em construção";
document.getElementById(p === "protocolos" ? "lp" : "la").classList.add("on");
document.getElementById("atual").href = "https://saulopierrout.github.io/biblioteca/" + (p === "protocolos" ? "protocolos.html" : "animacao.html");
</script>
<script src="titulo-blur.js"></script>
</body>
</html>
