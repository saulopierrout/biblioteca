<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heat Haze · versão em código</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000}
  .cena{position:absolute;inset:0;overflow:hidden;background:linear-gradient(#2e0d40 0%,#ff7320 62%)}
  .sol{position:absolute;left:50%;top:60%;width:28vmin;height:28vmin;margin:-14vmin 0 0 -14vmin;border-radius:50%;background:#ffdb8c}
  .chao{position:absolute;left:0;right:0;top:64%;bottom:0;background:#140a0f}
  .txt{position:absolute;left:0;right:0;top:79%;text-align:center;font:900 14vmin/1 Archivo,system-ui,sans-serif;font-stretch:100%;color:#F7F7F5;letter-spacing:-.02em}
  /* a cena inteira passa pelo filtro, mas só a metade de baixo aparece (máscara em degradê) */
  .calor{filter:url(#tremor);-webkit-mask-image:linear-gradient(transparent 40%,#000 62%);mask-image:linear-gradient(transparent 40%,#000 62%)}
</style>
</head>
<body>
<!-- Calor tremendo em código (SVG + CSS): feTurbulence gera o ruído, feDisplacementMap entorta a imagem
     e o JavaScript faz o ruído subir. Para usar no seu vídeo/imagem: troque o conteúdo de .cena e aplique
     filter:url(#tremor) numa cópia por cima, com a máscara onde quiser o calor. Ajuste FORCA e FINURA. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="tremor" x="0" y="0" width="100%" height="100%">
    <feTurbulence id="ruido" type="turbulence" baseFrequency="0.012 0.06" numOctaves="2" seed="3" result="r"/>
    <feOffset id="sobe" in="r" dx="0" dy="0" result="r2"/>
    <feDisplacementMap in="SourceGraphic" in2="r2" scale="18" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feGaussianBlur in="d" stdDeviation="0.6"/>
  </filter>
</svg>
<div class="cena" aria-label="Pôr do sol com o calor tremendo sobre o chão"><div class="sol"></div><div class="chao"></div><div class="txt">CALOR</div></div>
<div class="cena calor" aria-hidden="true"><div class="sol"></div><div class="chao"></div><div class="txt">CALOR</div></div>
<script>
const FORCA = 18, FINURA = 0.06, VELOCIDADE = 90;   // px por segundo que o ruído sobe
const ruido = document.getElementById("ruido"), sobe = document.getElementById("sobe");
document.querySelector("feDisplacementMap").setAttribute("scale", FORCA);
ruido.setAttribute("baseFrequency", `0.012 ${FINURA}`);
const parado = matchMedia("(prefers-reduced-motion: reduce)").matches;
function quadro(ms){
  const t = ms / 1000;
  // o ruído desce no mapa = a distorção sobe na imagem; um leve "respiro" na frequência dá vida
  sobe.setAttribute("dy", (-(t * VELOCIDADE) % 2000).toFixed(1));
  ruido.setAttribute("baseFrequency", `${(0.012 + Math.sin(t * 1.3) * 0.002).toFixed(4)} ${FINURA}`);
  if (!parado) requestAnimationFrame(quadro);
}
requestAnimationFrame(quadro);
</script>
</body>
</html>
